name: Portability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Install mise and pinned tools
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Sync the Python environment
        run: mise run setup

      - name: Run portability and regression checks
        run: |
          task check
          uv run pytest -q
          uv run mkdocs build --clean
