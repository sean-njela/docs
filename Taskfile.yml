##########################################################################
# Global configuration
##########################################################################
version: "3"
output: prefixed
dotenv:
  - .env
  - .env.local

env:
  ENV: '{{.ENV | default "dev"}}'
  DEBUG: '{{.DEBUG | default "false"}}'

vars:
  PROJECT_NAME: '{{.PROJECT_NAME | default "my-project"}}'
  TIMESTAMP:
    sh: date '+%Y%m%d%H%M%S'
  DOCS_COMPOSE_FILE: docker-compose.mkdocs.yml
  MKDOCS_PORT: 0.0.0.0:8030

includes:
  common:
    taskfile: ./Taskfile.gitflow.yml
    flatten: true


##########################################################################
# Core workflow
##########################################################################
tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list-all

  setup:
    desc: "Install pinned tools, sync dependencies, and install hooks"
    cmds:
      - mise run setup
      - pre-commit install

  check:
    desc: "Run all configured repository checks"
    cmds:
      - task: precommit

  precommit:
    desc: "Run all configured pre-commit checks"
    cmds:
      - pre-commit run --all-files

  test:ci:
    desc: "Run all event-driven GitHub workflows and tests through act"
    preconditions:
      - sh: command -v act >/dev/null 2>&1
        msg: "act is required. Install the pinned tools with 'mise install'."
      - sh: command -v docker >/dev/null 2>&1
        msg: "Docker CLI is required. Install Docker Desktop or Docker Engine."
      - sh: docker info >/dev/null 2>&1
        msg: "Docker daemon is unavailable. Start Docker Desktop or Docker Engine, then retry."
    cmds:
      # act cannot emulate hosted macOS runners; GitHub Actions runs those matrix legs.
      - |
        set -eu
        mkdir -p .task
        for event in push pull_request; do
          log_file=".task/test-ci-${event}.log"
          if act "${event}" --workflows .github/workflows --matrix os:ubuntu-latest --quiet >"${log_file}" 2>&1; then
            echo "act ${event} workflow passed"
          else
            cat "${log_file}"
            exit 1
          fi
        done


  _not-configured:
    internal: true
    requires:
      vars: [task_name]
    cmds:
      - |
        echo "Task '{{.task_name}}' is not configured for this project."
        echo "Add the project-specific commands to Taskfile.yml before using it."
        exit 1

##########################################################################
# Development workflow
##########################################################################
  dev:
    desc: "Start the local development workflow"
    cmds:
      - task: dev:up

  dev:up:
    desc: "Start all application services locally"
    cmds:
      - task: _not-configured
        vars: { task_name: dev:up }

  dev:down:
    desc: "Stop all local application services"
    cmds:
      - task: _not-configured
        vars: { task_name: dev:down }

  dev:logs:
    desc: "Stream logs from local application services"
    cmds:
      - task: _not-configured
        vars: { task_name: dev:logs }

  dev:status:
    desc: "Show local application service status"
    cmds:
      - task: _not-configured
        vars: { task_name: dev:status }

  status:
    desc: "Show the current Git worktree status"
    cmds:
      - git status --short --branch

  info:
    desc: "Print project workflow information"
    cmds:
      - echo "Project -> {{.PROJECT_NAME}}"
      - echo "Environment -> {{.ENV}}"
      - echo "Docs server -> http://{{.MKDOCS_PORT}}/"

##########################################################################
# Quality and delivery extension points
##########################################################################
  build:
    desc: "Build project artifacts"
    cmds:
      - task: _not-configured
        vars: { task_name: build }

  test:
    desc: "Run the project test suite"
    cmds:
      - task: _not-configured
        vars: { task_name: test }

  lint:
    desc: "Run project linters and formatters"
    cmds:
      - task: _not-configured
        vars: { task_name: lint }

  deploy:dev:
    desc: "Deploy the project to the development environment"
    cmds:
      - task: _not-configured
        vars: { task_name: deploy:dev }

  deploy:staging:
    desc: "Deploy the project to the staging environment"
    cmds:
      - task: _not-configured
        vars: { task_name: deploy:staging }

  deploy:prod:
    desc: "Deploy the project to the production environment"
    cmds:
      - task: _not-configured
        vars: { task_name: deploy:prod }

  rollback:
    desc: "Roll back the last deployment"
    cmds:
      - task: _not-configured
        vars: { task_name: rollback }

  infra:plan:
    desc: "Preview infrastructure changes"
    cmds:
      - task: _not-configured
        vars: { task_name: infra:plan }

  infra:apply:
    desc: "Apply infrastructure changes"
    cmds:
      - task: _not-configured
        vars: { task_name: infra:apply }

##########################################################################
# System management
##########################################################################
  ports:
    desc: "List listening TCP and UDP ports"
    cmds:
      - ss -tunl

##########################################################################
# Documentation server
##########################################################################
  docs:
    desc: "Serve MkDocs locally with live reload"
    cmds:
      - uv run mkdocs serve --clean -a {{.MKDOCS_PORT}}

  docs-docker:
    desc: "Serve MkDocs through Docker Compose"
    cmds:
      - docker compose -f {{.DOCS_COMPOSE_FILE}} up -d

  docs-docker:down:
    desc: "Stop the Docker-based MkDocs server"
    cmds:
      - docker compose -f {{.DOCS_COMPOSE_FILE}} down

##########################################################################
# Cleanup tasks
##########################################################################
  cleanup-zone:
    desc: "Remove Windows Zone.Identifier files"
    cmds:
      - find . -type f -name "*Zone.Identifier*" -delete

  cleanup:
    desc: "Remove generated metadata and temporary files"
    cmds:
      - task: cleanup-zone

  cleanup-all:
    desc: "Run all local cleanup tasks"
    cmds:
      - task: cleanup

##########################################################################
# Asset workflow
##########################################################################
  mkdir-assets:
    desc: "Create the assets directory"
    cmds:
      - cmd: mkdir -p assets
        silent: true
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force assets | Out-Null"
        silent: true
        platforms: [windows]

  compress:
    desc: "Compress a video into assets/demo-video-small.mp4"
    deps: [mkdir-assets]
    requires:
      vars: [video]
    vars:
      crf: "{{.crf | default 28}}"
      preset: '{{.preset | default "veryfast"}}'
    cmds:
      - >
        ffmpeg -i "{{.video}}"
        -vf "scale=1280:-2,fps=24"
        -c:v libx264 -crf {{.crf}} -preset {{.preset}}
        -movflags +faststart
        -c:a aac -b:a 96k
        assets/demo-video-small.mp4
        -y
    sources:
      - "{{.video}}"
    generates:
      - assets/demo-video-small.mp4

  compress-gif:
    desc: "Compress a GIF into assets/demo-video-small.gif"
    deps: [mkdir-assets]
    requires:
      vars: [gif]
    vars:
      fps: "{{.fps | default 8}}"
      colors: "{{.colors | default 64}}"
    cmds:
      - >
        ffmpeg -y -i "{{.gif}}"
        -vf "fps={{.fps}},scale=iw:-1:flags=lanczos,palettegen=max_colors={{.colors}}"
        assets/palette.png
      - >
        ffmpeg -y -i "{{.gif}}" -i assets/palette.png
        -lavfi "fps={{.fps}},scale=iw:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=5"
        assets/demo-video-small.gif
      - rm -f assets/palette.png
    sources:
      - "{{.gif}}"
    generates:
      - assets/demo-video-small.gif

##########################################################################
# Utilities
##########################################################################
  repomix:
    desc: "Generate a repository context bundle with security checks enabled"
    cmds:
      - >
        docker run -v .:/app -it --rm
        ghcr.io/yamadashy/repomix
        --output-show-line-numbers
        --style markdown
